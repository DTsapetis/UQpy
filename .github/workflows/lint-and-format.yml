name: Lint and Format

on:
    push:
        branches:
        - master
        - develop
    pull_request:
        branches:
        - master
        - develop
        - dependabot/*
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
  contents: read

jobs: 
    linting:
        runs-on: self-hosted
        steps:
        - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        - name: Set up Python # Required for the self-hosted runner. 
          uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
          with:
            python-version: "3.9"
            cache: 'pip' 
        - name: Install Pylint
          run: pip install pylint
        - name: Lint code
          run: pylint --ignored-modules=numpy,scipy,matplotlib,sklearn --disable=E0601,E0606,E0202,E1136,E1120,E0401,E0213 --disable=R,C,W src/UQpy
    ruff-formatting:
        runs-on: self-hosted
        steps:
        - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        - name: Set up Python
          uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
          with:
            python-version: "3.9"
            cache: 'pip' 
        - name: Install Ruff
          run: pip install ruff==0.11.7
        - name: Lint with Ruff
          run: |
            if ["${{github.event_name}}" = "pull_request"]; then
              echo "CHANGED_FILES=$(git fetch origin ${{ github.base_ref }} && git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.py$' | tr '\n' ' ')" >> $GITHUB_ENV
              ruff check $CHANGED_FILES
            else
              ruff check src/UQpy/
            fi         
